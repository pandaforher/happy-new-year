<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restricted Access</title>
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a0b1a, #000);
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
    }
    .card {
      padding: 40px;
      width: 80%;
      max-width: 350px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 10px; font-weight: 300; letter-spacing: 2px; font-size: 1.5rem; }
    p { color: #aaa; margin-bottom: 30px; font-size: 0.9rem; }
    
    /* Button Styles */
    .btn {
      display: block;
      width: 100%;
      padding: 15px 0;
      margin: 10px 0;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.95); }

    .enter-btn { 
      background: linear-gradient(45deg, #00dbb5, #00b894); 
      color: #000; 
      box-shadow: 0 5px 15px rgba(0, 219, 181, 0.3);
    }
    
    /* Loading Spinner */
    .loader {
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #00dbb5;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
        display: none;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div id="login-section">
        <h1>RESTRICTED</h1>
        <p>This area is private.<br>Please identify yourself.</p>
        <button onclick="netlifyIdentity.open('login')" class="btn enter-btn">Log In</button>
    </div>

    <div id="loading-section" style="display: none;">
        <h1>ACCESS GRANTED</h1>
        <p>Unlocking memories...</p>
        <div class="loader" style="display:block;"></div>
    </div>
  </div>

  <script>
    const loginSection = document.getElementById('login-section');
    const loadingSection = document.getElementById('loading-section');

    // Initialize the Widget
    netlifyIdentity.init();

    // --- THE SECRET SAUCE ---
    // If the browser remembers a user, Log them OUT immediately.
    // This forces the login prompt every single time the page loads.
    if (netlifyIdentity.currentUser()) {
        netlifyIdentity.logout();
    }
    // ------------------------

    // Listen for a NEW login
    netlifyIdentity.on('login', user => {
        // Once they successfully type the password...
        netlifyIdentity.close();
        
        // Show the loading animation
        loginSection.style.display = 'none';
        loadingSection.style.display = 'block';
        
        // Redirect after 1 second
        setTimeout(() => {
            window.location.href = "/day24.html";
        }, 1000);
    });
  </script>

</body>
</html>
